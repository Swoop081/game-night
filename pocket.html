<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14052b"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Draw This · Pocket</title>
<style>
:root{--o:#ff7a00;--bg:#14052b;--bg2:#0a0218}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:#fff;font-family:"Oxanium",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;min-height:100dvh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:var(--bg2);flex:none}
#top b{letter-spacing:.2em;font-size:.8rem;text-transform:uppercase}
#top b small{display:block;color:var(--o);letter-spacing:.3em;font-size:.6rem}
#top .sp{flex:1}
#top button{background:rgba(255,255,255,.12);color:#fff;font-size:.9rem;padding:6px 10px;border-radius:8px}
#main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);text-align:center;width:100%;max-width:560px;margin:0 auto}
h1{margin:0;font-size:2rem;text-transform:uppercase;letter-spacing:.06em}
h2{margin:0;font-size:1.3rem;text-transform:uppercase;letter-spacing:.12em}
p{margin:0;opacity:.85;line-height:1.4}
button{font:800 1.1rem "Oxanium",system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;border:0;border-radius:12px;padding:15px 22px;background:var(--o);color:var(--bg);cursor:pointer}
button.ghost{background:rgba(255,255,255,.12);color:#fff}
button.big{width:100%;font-size:1.3rem;padding:18px}
button:disabled{opacity:.4}
input{font:700 1.4rem system-ui;padding:14px;border-radius:12px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;text-align:center;width:100%;user-select:text;-webkit-user-select:text}
input.code{text-transform:uppercase;letter-spacing:.35em}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.chip{padding:8px 12px;font-size:.8rem;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;letter-spacing:.08em}
.chip.on{background:var(--o);color:var(--bg)}
.code4{font-size:3.6rem;letter-spacing:.3em;font-weight:900;color:var(--o);padding-left:.3em}
.pl{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;background:color-mix(in srgb,var(--c) 35%,var(--bg2));border-left:8px solid var(--c);text-align:left;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.pl i{margin-left:auto;font-style:normal;font-size:1.6rem}
.pl.off{opacity:.45}
.vote{width:100%;display:flex;align-items:center;padding:18px;background:var(--c);color:#fff;font-size:1.3rem;text-shadow:0 1px 3px rgba(0,0,0,.5);text-align:left}
.vote.sel{outline:5px solid #fff}
.word{background:var(--o);color:var(--bg);font-weight:900;text-transform:uppercase;padding:22px 16px;font-size:clamp(2.2rem,11vw,3.6rem);line-height:1.02;width:100%;overflow-wrap:anywhere}
.clock{font-size:min(38vw,9rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.clock.low{background:#e5173f;padding:0 .2em;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.tag{background:var(--o);color:var(--bg);padding:6px 14px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
.tag.x3{background:#ff2e63;color:#fff}
.k{color:var(--o);letter-spacing:.3em;text-transform:uppercase;font-weight:800;font-size:.85rem}
img.qr{background:#fff;padding:8px;border-radius:10px}
.hide{display:none!important}
.err{color:#ff8a8a;min-height:1.2em}
</style></head><body>
<div id="top"><b>Game Night<small>Draw This · Pocket</small></b><span class="sp"></span><button id="mute">Sound on</button></div>
<div id="main"></div>
<script src="peerjs.min.js"></script>
<script src="pocketwords.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const q=new URLSearchParams(location.search);
const ICE=[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"},{urls:"stun:stun.cloudflare.com:3478"},{urls:["turn:openrelay.metered.ca:80","turn:openrelay.metered.ca:443"],username:"openrelayproject",credential:"openrelayproject"}];
const cfg=()=>{const o={debug:0,config:{iceServers:ICE}};if(q.get("peerhost")){o.host=q.get("peerhost");o.port=+(q.get("peerport")||9000);o.secure=false;o.path="/"}return o};
const COLORS=["#e5173f","#2b6cff","#1fb865","#ff7a00","#9b4dff","#00b8d4","#ff4fb0","#ffd400","#ffffff","#8d5a3b"];
const ALPHA="ABCDEFGHJKMNPQRSTUVWXYZ";
const rnd=()=>Array.from({length:4},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join("");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const base=location.origin+location.pathname.replace(/[^\/]*$/,"");
let me=ls.get("gnp.pid");if(!me){me="p"+Math.random().toString(36).slice(2,9);ls.set("gnp.pid",me)}
let myName=ls.get("gnp.name")||"";
let isHost=false,ST=null,conn=null,peer=null,code="",selVote=null,sound=ls.get("gnp.snd")!=="0";

/* ---------- sound ---------- */
let AC=null;
const ac=()=>{try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}return AC};
const tone=(f,d,t="square",v=.2,when=0)=>{if(!sound)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+when;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.02)};
const SFX={tick(){tone(900,.05,"square",.15)},warn(){tone(1200,.09,"square",.28)},blip(){tone(660,.12,"triangle",.3)},go(){tone(990,.35,"triangle",.35)},buzz(){tone(140,.9,"sawtooth",.45);tone(150,.9,"square",.3);try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}},ok(){tone(660,.1,"triangle",.3);tone(880,.15,"triangle",.3,.1)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",.3,i*.14))}};
$("#mute").onclick=()=>{sound=!sound;ls.set("gnp.snd",sound?"1":"0");$("#mute").textContent=sound?"Sound on":"Sound off"};
$("#mute").textContent=sound?"Sound on":"Sound off";
let wl=null;const keepAwake=async()=>{try{if(navigator.wakeLock)wl=await navigator.wakeLock.request("screen")}catch(e){}};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&ST)keepAwake()});

/* ---------- host engine ---------- */
const H={players:[],conns:{},CFG:{rounds:8,secs:60,packs:["animals","food","things","actions","places","silly"]},phase:"lobby",round:0,mult:1,word:"",left:0,votes:{},gain:{},tmr:null,used:new Set(),hostId:"",countN:0};
try{const j=JSON.parse(ls.get("gnp.cfg")||"null");if(j){Object.assign(H.CFG,j);H.CFG.packs=(H.CFG.packs||[]).filter(x=>PACKS[x]);if(!H.CFG.packs.length)H.CFG.packs=Object.keys(PACKS)}}catch(e){}
const saveCfg=()=>ls.set("gnp.cfg",JSON.stringify(H.CFG));
const view=()=>({code,phase:H.phase,round:H.round,rounds:H.CFG.rounds,secs:H.CFG.secs,packs:H.CFG.packs,mult:H.mult,word:H.phase==="draw"||H.phase==="vote"||H.phase==="result"?H.word:"",left:H.left,count:H.countN,hostId:H.hostId,
  players:H.players.map(p=>({id:p.id,name:p.name,color:p.color,score:p.score,on:p.on,voted:H.votes[p.id]!=null,spec:!!p.spec})),gain:H.gain,final:H.round>=H.CFG.rounds});
const bcast=()=>{const v=view();Object.values(H.conns).forEach(c=>{try{c.open&&c.send({k:"st",v})}catch(e){}});ST=v;render()};
const colorFor=()=>COLORS.find(c=>!H.players.some(p=>p.color===c))||COLORS[H.players.length%COLORS.length];
const addPlayer=(id,name)=>{let p=H.players.find(x=>x.id===id);if(p){p.name=name||p.name;p.on=true;return p}
  p={id,name:(name||"Player").slice(0,14),color:colorFor(),score:0,on:true,spec:H.phase!=="lobby"};H.players.push(p);return p};
const pickWord=()=>{const pool=[];H.CFG.packs.forEach(k=>(PACKS[k]||[]).forEach(w=>pool.push(w)));let w,n=0;do{w=pool[Math.floor(Math.random()*pool.length)];n++}while(H.used.has(w)&&n<200);H.used.add(w);return w};
const active=()=>H.players.filter(p=>!p.spec);
function startGame(){H.players.forEach(p=>{p.score=0;p.spec=false});H.round=0;H.used.clear();nextRound()}
function nextRound(){clearInterval(H.tmr);H.round++;H.votes={};H.gain={};H.word=pickWord();
  const fin=H.round>=H.CFG.rounds,late=H.round>H.CFG.rounds/2,r=Math.random();
  H.mult=late&&r<.04?3:(late&&r<.2)||fin?2:1;if(H.round===H.CFG.rounds&&H.mult<2)H.mult=2;
  H.phase="announce";bcast();SFX.blip()}
function startCount(){H.phase="count";H.countN=3;bcast();SFX.blip();
  H.tmr=setInterval(()=>{H.countN--;if(H.countN>0){bcast();SFX.blip()}else{clearInterval(H.tmr);startDraw()}},1000)}
function startDraw(){H.phase="draw";H.left=H.CFG.secs;bcast();SFX.go();
  H.tmr=setInterval(()=>{H.left--;if(H.left<=0){clearInterval(H.tmr);SFX.buzz();startVote()}else{H.left<=10?SFX.warn():(H.left<=20||H.left%5===0?SFX.tick():0);bcast()}},1000)}
function startVote(){clearInterval(H.tmr);H.phase="vote";H.left=0;bcast()}
function castVote(from,to){if(H.phase!=="vote"||from===to)return;const f=H.players.find(p=>p.id===from),t=H.players.find(p=>p.id===to);if(!f||!t||f.spec||t.spec)return;H.votes[from]=to;
  if(active().every(p=>H.votes[p.id]!=null))showResult();else bcast()}
function showResult(){if(H.phase==="result")return;H.gain={};Object.values(H.votes).forEach(t=>{H.gain[t]=(H.gain[t]||0)+H.mult});
  H.players.forEach(p=>{p.score+=H.gain[p.id]||0});H.phase="result";bcast();SFX.ok()}
function finish(){H.phase="final";bcast();SFX.win()}
function onMsg(c,m){if(!m)return;
  if(m.k==="hello"){const p=addPlayer(m.pid,m.name);H.conns[m.pid]=c;c.__pid=m.pid;bcast();return}
  const pid=c.__pid;if(!pid)return;
  if(m.k==="vote")castVote(pid,m.to)}
function hostAction(a){
  if(a==="start"&&H.phase==="lobby"&&active().length>=2)startGame();
  else if(a==="go"&&H.phase==="announce")startCount();
  else if(a==="end"&&H.phase==="draw")startVote();
  else if(a==="results"&&H.phase==="vote")showResult();
  else if(a==="next"&&H.phase==="result")H.round>=H.CFG.rounds?finish():nextRound();
  else if(a==="again"){clearInterval(H.tmr);H.phase="lobby";H.round=0;H.players=H.players.filter(p=>p.on);H.players.forEach(p=>{p.score=0;p.spec=false});bcast()}}

/* ---------- networking ---------- */
function startHost(){isHost=true;code=rnd();H.hostId=me;keepAwake();
  peer=new Peer("gnpocket-"+code,cfg());
  peer.on("open",()=>{addPlayer(me,myName);bcast()});
  peer.on("error",e=>{if(e&&e.type==="unavailable-id"){try{peer.destroy()}catch(_){}startHost()}else if(e&&e.type==="network"||e.type==="server-error"||e.type==="socket-error"){setTimeout(()=>{try{peer.reconnect()}catch(_){}},2000)}});
  peer.on("disconnected",()=>{try{peer.reconnect()}catch(_){}});
  peer.on("connection",c=>{c.on("data",m=>onMsg(c,m));c.on("close",()=>{const p=H.players.find(x=>x.id===c.__pid);if(p&&H.conns[p.id]===c){p.on=false;bcast()}})});
  ST=view();render()}
function startJoin(cd){isHost=false;code=cd.toUpperCase();keepAwake();let tries=0;
  const go=()=>{try{peer&&peer.destroy()}catch(e){}
    peer=new Peer(undefined,cfg());
    peer.on("open",()=>{conn=peer.connect("gnpocket-"+code,{reliable:true});
      const to=setTimeout(()=>{if(!conn.open)retry("Can't reach that game. Check the code and that the host has the page open.")},12000);
      conn.on("open",()=>{clearTimeout(to);tries=0;note("");conn.send({k:"hello",pid:me,name:myName})});
      conn.on("data",m=>{if(m&&m.k==="st"){const prev=ST;ST=m.v;react(prev,ST);render()}});
      conn.on("close",()=>retry("Lost the host. Reconnecting…"));
      conn.on("error",()=>retry("Connection problem. Retrying…"))});
    peer.on("error",e=>{retry(e&&e.type==="peer-unavailable"?"Game not found. Check the code.":"Connection problem. Retrying…")})};
  let rt=null;const retry=msg=>{if(rt)return;note(msg);rt=setTimeout(()=>{rt=null;tries++;go()},tries<3?1500:3500)};
  go();note("Connecting…")}
function send(m){if(isHost)onMsg({__pid:me,open:true,send(){}},m);else if(conn&&conn.open)conn.send(m)}
function act(a){if(isHost)hostAction(a)}
let noteT="";const note=t=>{noteT=t;const e=$("#note");if(e)e.textContent=t};

/* clients mirror sounds from state changes */
function react(p,n){if(!p||!n)return;
  if(n.phase==="announce"&&p.phase!=="announce")SFX.blip();
  if(n.phase==="count"&&n.count!==p.count)SFX.blip();
  if(n.phase==="draw"){if(p.phase!=="draw")SFX.go();else if(n.left<p.left){n.left<=10?SFX.warn():(n.left<=20||n.left%5===0?SFX.tick():0)}}
  if(n.phase==="vote"&&p.phase==="draw")SFX.buzz();
  if(n.phase==="result"&&p.phase!=="result")SFX.ok();
  if(n.phase==="final"&&p.phase!=="final")SFX.win();
  if(n.phase!=="vote")selVote=null}

/* ---------- screens ---------- */
const M=$("#main");
const mmss=s=>String(s);
const plist=(pl,showScore)=>pl.map(p=>`<div class="pl${p.on?"":" off"}" style="--c:${p.color}">${esc(p.name)}${p.id===ST.hostId?" · host":""}${showScore?`<i>${p.score}</i>`:""}</div>`).join("");
const multTag=m=>m>1?`<div class="tag${m>2?" x3":""}">${m>2?"Triple":"Double"} points</div>`:"";
function render(){
  if(!ST){return}
  const s=ST,meP=s.players.find(p=>p.id===me),spec=!meP||meP.spec;let h="";
  if(s.phase==="lobby"){
    const join=base+"pocket.html?c="+s.code+(q.get("peerhost")?"&peerhost="+q.get("peerhost")+"&peerport="+(q.get("peerport")||9000):"");
    h=`<div class="k">Game code</div><div class="code4">${esc(s.code)}</div>
    <img class="qr" width="170" height="170" alt="" src="https://api.qrserver.com/v1/create-qr-code/?size=170x170&data=${encodeURIComponent(join)}">
    <div class="row">${isHost?`<button class="ghost" id="share">Share invite link</button>`:""}</div>
    <div style="width:100%">${plist(s.players)}</div>`;
    if(isHost){h+=`<div class="k">Rounds</div><div class="row">${[5,8,10].map(n=>`<button class="chip${s.rounds===n?" on":""}" data-r="${n}">${n}</button>`).join("")}</div>
      <div class="k">Seconds to draw</div><div class="row">${[30,60,90,120].map(n=>`<button class="chip${s.secs===n?" on":""}" data-s="${n}">${n}</button>`).join("")}</div>
      <div class="k">Word packs</div><div class="row">${Object.keys(PACKS).map(k=>`<button class="chip${s.packs.includes(k)?" on":""}" data-p="${k}">${PACK_NAMES[k]}</button>`).join("")}</div>
      <button class="big" id="start" ${s.players.filter(p=>!p.spec).length<2?"disabled":""}>${s.players.length<2?"Waiting for players…":"Start game"}</button>`}
    else h+=`<p>Waiting for the host to start…</p>`}
  else if(s.phase==="announce"){
    h=`<div class="k">Round ${s.round} of ${s.rounds}</div>${s.final?`<h1>Final round</h1>`:`<h1>Get ready</h1>`}${multTag(s.mult)}
    <p>Grab your whiteboard and marker. Everyone draws the same word at the same time.</p>
    ${isHost?`<button class="big" id="go">Start round</button>`:`<p>Waiting for the host…</p>`}`}
  else if(s.phase==="count"){h=`<div class="k">Round ${s.round}</div><div class="clock">${s.count}</div>`}
  else if(s.phase==="draw"){
    h=`<div class="k">Round ${s.round} of ${s.rounds}${s.mult>1?" · x"+s.mult:""}</div><div class="word">${esc(s.word)}</div><div class="clock${s.left<=10?" low":""}" id="clk">${s.left}</div><p>Draw it on your whiteboard</p>
    ${isHost?`<button class="ghost" id="end">End early</button>`:""}`}
  else if(s.phase==="vote"){
    const done=meP&&s.players.find(p=>p.id===me).voted;
    h=`<h1>Hold up your boards!</h1><p>${spec?"Watching this round":done?"Vote locked in. Waiting for others… ("+s.players.filter(p=>p.voted).length+"/"+s.players.filter(p=>!p.spec).length+")":"Vote for your favourite drawing"}</p>`;
    if(!spec&&!done)h+=s.players.filter(p=>p.id!==me&&!p.spec).map(p=>`<button class="vote" style="--c:${p.color}" data-v="${p.id}">${esc(p.name)}</button>`).join("");
    if(isHost)h+=`<button class="ghost" id="results">Show results</button>`}
  else if(s.phase==="result"){
    const sorted=s.players.slice().sort((a,b)=>b.score-a.score);
    h=`<div class="k">Word: ${esc(s.word)}</div><h2>Round ${s.round} scores</h2>${multTag(s.mult)}
    <div style="width:100%">${sorted.map(p=>`<div class="pl${p.on?"":" off"}" style="--c:${p.color}">${esc(p.name)}${s.gain[p.id]?` <span style="color:var(--o)">+${s.gain[p.id]}</span>`:""}<i>${p.score}</i></div>`).join("")}</div>
    ${isHost?`<button class="big" id="next">${s.final?"Final results":"Next round"}</button>`:`<p>Waiting for the host…</p>`}`}
  else if(s.phase==="final"){
    const sorted=s.players.slice().sort((a,b)=>b.score-a.score),top=sorted[0]?sorted[0].score:0;
    h=`<div class="k">Game over</div><h1>${sorted.filter(p=>p.score===top).map(p=>esc(p.name)).join(" & ")} won!</h1>
    <div style="width:100%">${sorted.map((p,i)=>`<div class="pl" style="--c:${p.color}">${i+1}. ${esc(p.name)}<i>${p.score}</i></div>`).join("")}</div>
    ${isHost?`<button class="big" id="again">Play again</button>`:`<p>Waiting for the host…</p>`}`}
  h+=`<div class="err" id="note"></div>`;
  /* keep the clock element update light */
  M.innerHTML=h;note(noteT);bind()}
function bind(){
  const on=(sel,fn)=>{const e=$(sel);if(e)e.onclick=()=>{ac();fn(e)}};
  on("#start",()=>act("start"));on("#go",()=>act("go"));on("#end",()=>act("end"));on("#results",()=>act("results"));on("#next",()=>act("next"));on("#again",()=>act("again"));
  on("#share",()=>{const u=base+"pocket.html?c="+ST.code,t="Join my Draw This game, code "+ST.code;if(navigator.share)navigator.share({title:"Draw This",text:t,url:u}).catch(()=>{});else{try{navigator.clipboard.writeText(u);note("Link copied")}catch(e){}}});
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{H.CFG.rounds=+b.dataset.r;saveCfg();bcast()});
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{H.CFG.secs=+b.dataset.s;saveCfg();bcast()});
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const k=b.dataset.p,i=H.CFG.packs.indexOf(k);if(i>=0){if(H.CFG.packs.length>1)H.CFG.packs.splice(i,1)}else H.CFG.packs.push(k);saveCfg();bcast()});
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ac();send({k:"vote",to:b.dataset.v});if(!isHost){const meP=ST.players.find(p=>p.id===me);if(meP)meP.voted=true;render()}})}

/* ---------- home ---------- */
function home(){
  const c0=(q.get("c")||"").toUpperCase();
  M.innerHTML=`<h1>Draw This</h1><p>Play on the go with just your phones, a whiteboard and a marker. No TV needed. Everyone needs a phone with internet (wifi or mobile data).</p>
  <input id="nm" placeholder="Your name" maxlength="14" value="${esc(myName)}" autocomplete="off">
  <input id="cd" class="code" placeholder="CODE" maxlength="4" value="${esc(c0)}" autocomplete="off" autocapitalize="characters">
  <button class="big" id="join">Join a game</button>
  <button class="big ghost" id="host">Host a new game</button><div class="err" id="note"></div>`;
  const name=()=>{const v=$("#nm").value.trim();if(!v){note("Enter your name first");return null}myName=v.slice(0,14);ls.set("gnp.name",myName);return myName};
  $("#join").onclick=()=>{ac();if(!name())return;const c=$("#cd").value.trim().toUpperCase();if(c.length!==4)return note("Enter the 4 letter code");startJoin(c)};
  $("#host").onclick=()=>{ac();if(!name())return;startHost()};
  if(c0.length===4&&myName){/* returning via link with a saved name: still let them confirm */}}
let lastLeft=-1;
if(!window.Peer){M.innerHTML="<p>Couldn't load. Check your internet and reload.</p>"}else home();
