plugins { id 'com.android.application' }
def runNum = ((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
android {
    namespace 'com.gamenight.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'com.gamenight.tv'
        minSdk 21
        targetSdk 34
        versionCode runNum
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('../gamenight.keystore')
            storePassword 'gamenight'
            keyAlias 'gamenight'
            keyPassword 'gamenight'
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.getByName('release')
            minifyEnabled = false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
