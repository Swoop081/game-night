plugins { id 'com.android.application' }
android {
    namespace 'com.gamenight.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'com.gamenight.tv'
        minSdk 21
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file('../gamenight.keystore')
            storePassword 'gamenight'
            keyAlias 'gamenight'
            keyPassword 'gamenight'
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
