<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1250"><title>Game Night · Join</title>
<style>
:root{--g:#ffd84a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{min-height:100vh;background:linear-gradient(160deg,#150e45,#3a1d8f) fixed;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;}
.col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%}
input{-webkit-user-select:text;user-select:text}
button{-webkit-user-select:none;user-select:none}
h1{margin:0;font-size:1.7rem;letter-spacing:.04em}
small{opacity:.7;letter-spacing:.2em;font-size:.75rem}
input{font:700 1.4rem system-ui;padding:14px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;text-align:center;width:min(320px,90vw);text-transform:none}
input.code{text-transform:uppercase;letter-spacing:.3em}
button{font:800 1.3rem system-ui;padding:16px 34px;border:0;border-radius:999px;background:var(--g);color:#2a1a00}
#st{opacity:.9;min-height:1.5em}
#big{font-size:4.5rem;transition:transform .2s}
.live #big{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
#heard{min-height:3em;font-size:1.5rem;font-weight:700;max-width:92vw}
.hide{display:none!important}
#duel{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:4px}
#duel.hide{display:none!important}
.pl{display:flex;gap:10px;width:100%}
.pc{flex:1;border-radius:14px;padding:8px 6px;background:rgba(255,255,255,.08);border:2px solid transparent;opacity:.6}
.pc.on{opacity:1;border-color:var(--c,#fff);background:rgba(255,255,255,.16)}
.pc b{display:block;font-size:.85rem;letter-spacing:.04em}.pc i{display:block;font-style:normal;font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums}
.pc u{display:block;height:5px;border-radius:3px;background:var(--c,#fff);transform-origin:left;text-decoration:none}
#cat{font-weight:800;font-size:1.1rem}#hint{opacity:.7;font-size:.8rem;margin-top:-6px}
.q{width:100%;min-height:36vh;border-radius:20px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:3.2rem;font-weight:900;padding:12px;text-align:center;overflow:hidden;line-height:1.1;word-break:break-word}
.q.text{font-size:2.2rem}.q.long{font-size:1.6rem}.q.long2{font-size:1.2rem}
.q.emoji{font-size:5.5rem}.q.emoji.multi{font-size:3.4rem}
.q img{max-width:100%;max-height:44vh;border-radius:12px;object-fit:contain}
.q .sw{width:70%;aspect-ratio:1;border-radius:16px}
.q.tiles{gap:6px;flex-wrap:wrap}.q.tiles span{display:inline-grid;place-items:center;width:1.4em;height:1.4em;background:#fff;color:#1a1636;border-radius:8px;font-size:1.8rem}
.q .eltile{display:flex;flex-direction:column;align-items:center;background:#fff;color:#1a1636;padding:10px 26px;border-radius:12px}.eltile .num{font-size:1rem}.eltile .sym{font-size:3.6rem}
#rv{min-height:1.6em;font-weight:800;font-size:1.1rem}#rv.ok{color:#5dffa0}#rv.pass{color:#ff9fb0}
#dst{opacity:.85}#dheard{min-height:1.4em;font-size:1.15rem;font-weight:700;opacity:.9}
#pass{background:#ff9fb0;color:#3a0016;padding:12px 30px;font-size:1.1rem}
#pass:disabled{opacity:.35}

.avprev img{border-radius:50%;background:#f4f1ff;border:4px solid var(--g);object-fit:cover}
.avtabs,.avrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.avgrid{display:grid;grid-template-columns:repeat(4,64px);gap:8px;justify-content:center}
.avgrid button{width:64px;height:64px;padding:2px;border-radius:50%;border:3px solid transparent;background:rgba(255,255,255,.12)}
.avgrid button img{width:100%;height:100%;border-radius:50%;background:#f4f1ff}
.avgrid button.on{border-color:var(--g)}
.mini{font:700 .9rem system-ui;padding:8px 14px;border-radius:999px;border:0;background:rgba(255,255,255,.18);color:#fff}
.mini.on{background:var(--g);color:#2a1a00}
#myav{width:96px;height:96px;border-radius:50%;background:#f4f1ff;border:4px solid var(--g);object-fit:cover}
</style></head><body>
<small>GAME NIGHT</small>
<div id="join" class="col">
  <h1>Join the game</h1>
  <input id="code" class="code" placeholder="TV code" maxlength="4" autocapitalize="characters" autocomplete="off">
  <input id="name" placeholder="Your name" maxlength="16" autocomplete="off">
  <div class="avprev"><img id="avimg" alt="" width="112" height="112"></div>
  <div class="avtabs" id="avtabs"></div>
  <div class="avgrid" id="avgrid"></div>
  <div class="avrow"><button class="mini" id="avshuf">🔀 Shuffle</button><button class="mini" id="avcam">📷 Selfie</button><input type="file" id="avfile" accept="image/*" capture="user" class="hide"></div>
  <button id="go">Join</button>
</div>
<div id="duel" class="hide">
  <div class="pl"><div class="pc" id="pa"><b></b><i></i><u></u></div><div class="pc" id="pb"><b></b><i></i><u></u></div></div>
  <div id="cat"></div><div id="hint"></div>
  <div id="q" class="q"></div>
  <div id="rv"></div>
  <div id="dst"></div><div id="dheard"></div>
  <button id="pass">Pass</button>
</div>
<div id="play" class="col hide">
  <img id="myav" alt="" class="hide"><div id="big">🎤</div>
  <h1 id="who"></h1>
  <div id="st"></div>
  <div id="heard"></div>
</div>
<div id="net" style="position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:.7rem;opacity:.45"></div>
<script src="peerjs.min.js?v=1"></script>
<script src="join.js?v=14"></script>
</body></html>
