<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1250"><title>Game Night · Join</title>
<style>
:root{--g:#ffd84a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{min-height:100vh;background:linear-gradient(160deg,#150e45,#3a1d8f) fixed;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;}
.col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%}
input{-webkit-user-select:text;user-select:text}
button{-webkit-user-select:none;user-select:none}
h1{margin:0;font-size:1.7rem;letter-spacing:.04em}
small{opacity:.7;letter-spacing:.2em;font-size:.75rem}
input{font:700 1.4rem system-ui;padding:14px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;text-align:center;width:min(320px,90vw);text-transform:none}
input.code{text-transform:uppercase;letter-spacing:.3em}
button{font:800 1.3rem system-ui;padding:16px 34px;border:0;border-radius:999px;background:var(--g);color:#2a1a00}
#st{opacity:.9;min-height:1.5em}
#big{font-size:4.5rem;transition:transform .2s}
.live #big{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
#heard{min-height:3em;font-size:1.5rem;font-weight:700;max-width:92vw}
.hide{display:none!important}
#duel{position:fixed;inset:0;display:flex;flex-direction:column;background:#0a1a7a;gap:0;overflow:hidden}
#duel.hide{display:none!important}
.pl{display:flex;flex:none}
.pc{flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;background:color-mix(in srgb,var(--c) 30%,#06104a);color:#fff;text-align:left;min-width:0}
.pc.on{background:var(--c)}
.pc img{width:44px;height:44px;background:#fff;object-fit:cover;flex:none}
.pc b{display:block;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc i{display:block;font-style:normal;font-size:2.1rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
#catbar{flex:none;background:#fff;color:#0a1a7a;padding:7px 10px;font-size:.72rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;display:flex;gap:10px;justify-content:center}
#catbar #hint{color:#4a55a8;font-weight:700}
.q{flex:1;min-height:0;background:#000;display:flex;align-items:center;justify-content:center;font-size:3.2rem;font-weight:900;padding:0;text-align:center;overflow:hidden;line-height:1.1;word-break:break-word}
.q.text,.q.color,.q.tiles,.q.el,.q.emoji{padding:12px}
.q.text{font-size:2.2rem}.q.long{font-size:1.6rem}.q.long2{font-size:1.2rem}
.q.emoji{font-size:5.5rem}.q.emoji.multi{font-size:3.4rem}
.q img{width:100%;height:100%;object-fit:cover}
.q.contain img{object-fit:contain}
.q .sw{width:70%;aspect-ratio:1}
.q.tiles{gap:6px;flex-wrap:wrap}.q.tiles span{display:inline-grid;place-items:center;width:1.4em;height:1.4em;background:#fff;color:#1a1636;font-size:1.8rem}
.q .eltile{display:flex;flex-direction:column;align-items:center;background:#fff;color:#1a1636;padding:10px 26px}.eltile .num{font-size:1rem}.eltile .sym{font-size:3.6rem}
#rv{flex:none;min-height:0;font-weight:800;font-size:1rem;text-align:center;letter-spacing:.06em;text-transform:uppercase}
#rv.ok{background:#16c784;color:#022;padding:8px}#rv.pass{background:#e5173f;color:#fff;padding:8px}
#pass{flex:none;border-radius:0;background:#e5173f;color:#fff;font-size:2.2rem;letter-spacing:.2em;padding:0;height:19vh;width:100%;border:0}
#pass:disabled{background:#3a1a40;color:rgba(255,255,255,.35)}
#pass:not(:disabled):active{background:#ff3b61}
#dst{flex:none;background:#06104a;padding:8px;font-size:.85rem;opacity:.95;letter-spacing:.04em;text-align:center}
#dheard{flex:none;background:#06104a;padding:0 8px 8px;min-height:1.4em;font-size:1rem;font-weight:700;text-align:center}
#map{flex:none;background:#000;padding:6px 0;display:grid;justify-content:center;gap:2px}
#map i{width:16px;height:16px;display:block;opacity:.5}#map i.hot{opacity:1;outline:2px solid #fff}
body.induel #net{display:none}
body.induel #logb{bottom:auto;top:2px;right:2px;z-index:20;padding:3px 8px;font-size:.6rem;opacity:.35}
/* compact join form: everything on one screen */
body{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 8px);gap:6px}
#join{gap:8px;flex:1;justify-content:space-evenly;max-width:460px}
#join h1{font-size:1.25rem}
#join input{font-size:1.1rem;padding:9px 12px;border-radius:10px;width:100%}
#join input.code{width:100%}
.avprev img{width:76px;height:76px;border-radius:50%;background:#fff3;object-fit:cover;display:block}
.mini{font:800 .8rem system-ui;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff}
.mini.on{background:var(--g);color:#2a1a00}
.avtabs,.avrow{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;width:100%}
.avtabs .mini,.avrow .mini{flex:1;padding:8px 4px;white-space:nowrap}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.avgrid button{padding:0;aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.12);border:2px solid transparent;overflow:hidden;font-size:0}
.avgrid button.on{border-color:var(--g);background:rgba(255,216,74,.25)}
.avgrid img{width:100%;height:100%;object-fit:cover;display:block}
#go{width:100%;padding:14px;font-size:1.2rem}
#logb{bottom:auto!important;top:4px!important;right:6px!important;padding:3px 8px;font-size:.6rem;opacity:.35!important}
/* companion view: the phone mirrors the TV game and acts as its controller */
#cmp{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);--bg:#150e45;--fg:#fff;--hd:#fff;--hdf:#150e45;--ac:#ffd84a;--acf:#2a1a00}
#cmp.hide{display:none!important}
#cmp.th-hl{--bg:#0a5c34;--hd:#fff;--hdf:#0a5c34;--ac:#ffd400;--acf:#222}
#cmp.th-cd{--bg:#0d2fb0;--hd:#ffd400;--hdf:#0d2fb0;--ac:#ffd400;--acf:#0d2fb0}
#cmp.th-nt{--bg:#033b40;--hd:#c6ff3d;--hdf:#033b40;--ac:#c6ff3d;--acf:#033b40}
#cmp.th-dt{--bg:#14052b;--hd:#ff7a00;--hdf:#14052b;--ac:#ff7a00;--acf:#14052b}
.cmword{font:900 2.6rem/1.05 system-ui;text-transform:uppercase;text-align:center;background:var(--ac);color:var(--acf);padding:18px 14px;max-width:100%;word-break:break-word}
#cmp.th-dt .cs{background:#2e1157;border-left:6px solid var(--c)}#cmp.th-dt .cs.on{background:#ff7a00;color:#14052b}
#cmp.th-dt #cmBody{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='white' stroke-opacity='.25' stroke-width='.7'><path d='M0 0L100 0M0 0L88 40M0 0L66 66M0 0L40 88M0 0L0 100M18 0Q14 14 0 18M38 0Q30 30 0 38M58 0Q46 46 0 58M80 0Q60 60 0 80'/></svg>") 0 0/32vw no-repeat,radial-gradient(120% 80% at 50% 110%,#3b0a52,#14052b)}
#cmp.th-pb{--bg:#0b0b12;--hd:#ff2d95;--hdf:#fff;--ac:#19e3ff;--acf:#0b0b12}
#cmScores{display:flex;flex:none}
.cs{flex:1;min-width:0;display:flex;gap:8px;align-items:center;padding:7px 9px;background:color-mix(in srgb,var(--c,#555) 30%,var(--bg));color:#fff}
.cs.on{background:var(--c,#555)}
.cs img{width:32px;height:32px;object-fit:cover;background:#fff;flex:none}
.cs div{min-width:0;text-align:left}.cs b{display:block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs i{display:block;font:800 1.5rem/1 system-ui;font-style:normal;font-variant-numeric:tabular-nums}
#cmHead{flex:none;padding:8px 14px;background:var(--hd);color:var(--hdf);text-align:left}
#cmHead small{display:block;letter-spacing:.2em;font-weight:800;font-size:.62rem;text-transform:uppercase;opacity:.75}
#cmHead b{display:block;font:900 1.35rem/1.1 system-ui;margin-top:2px}
#cmHead p{margin:2px 0 0;font-size:.8rem;opacity:.85}
#cmBody{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;overflow:hidden}
.cmcards{display:flex;gap:4vw;justify-content:center;align-items:center}
.pk{width:34vw;max-width:170px;aspect-ratio:5/7;background:#fff;color:#111;display:grid;place-items:center;font:900 17vw/1 system-ui;position:relative}
.pk.back{background:repeating-linear-gradient(45deg,#3a2a8c 0 10px,#2a1f6e 10px 20px);color:var(--ac);font-size:9vw}
.pk.ok{outline:6px solid #16c784}.pk.bad{outline:6px solid #e5173f}.pk.same{outline:6px solid #ffd400}
.cpic{width:100%;flex:1;min-height:0;object-fit:contain;background:#000;transition:filter .3s linear}
.cmbig{font:900 3.6rem/1 system-ui;color:var(--ac);font-variant-numeric:tabular-nums}
.cmchips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-height:30vh;overflow:hidden}
.cmchips span{padding:4px 10px;background:var(--ac);color:var(--acf);font-weight:800;font-size:.8rem}
.cmprizes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;width:100%}
.cmprize{flex:1 1 40%;max-width:48%;background:#fffdf6;color:#1a1636;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:.72rem;font-weight:800}
.cmprize img{width:100%;height:16vh;object-fit:contain}.cmprize .em{font-size:2.4rem}
.cmprize em{font-style:normal;color:#14532d;font-size:.9rem}
#cmFb{min-height:1.2em;font-weight:800;color:var(--ac);text-align:center;font-size:.95rem}
#cmForm{display:flex;gap:6px;width:100%}
#cmForm input{flex:1;min-width:0;font:700 1.2rem system-ui;padding:12px;border-radius:0;border:0;background:#fff;color:#111;text-align:left;width:auto}
#cmForm button,#cmNum button{border-radius:0}
#cmForm button{padding:0 18px;font-size:1rem;background:var(--ac);color:var(--acf)}
#cmNum{width:100%}
#cmNum .disp{font:900 2.4rem/1 system-ui;text-align:center;padding:6px;color:var(--ac)}
#cmNum .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
#cmNum .kp button{padding:13px 0;font-size:1.3rem;background:#fff;color:#111}
#cmNum .kp button.go{grid-column:span 2;background:var(--ac);color:var(--acf)}
#cmBtns{flex:none;display:flex;flex-direction:column;gap:3px}
#cmBtns.two{flex-direction:row}
#cmBtns.grid{display:grid;grid-template-columns:1fr 1fr}
.cb{flex:1;border-radius:0;border:0;padding:18px 10px;font:900 1.25rem/1.1 system-ui;text-transform:uppercase;letter-spacing:.08em;background:#fff;color:#111}
#cmBtns.big .cb{padding:0;min-height:20vh;font-size:2rem}
.cb.gold{background:var(--ac);color:var(--acf)}.cb.hi{background:#16c784;color:#022}.cb.lo{background:#e5173f;color:#fff}.cb.ghost{background:rgba(255,255,255,.18);color:var(--fg)}
.cb.sel,.cb.on{outline:4px solid var(--ac);outline-offset:-4px}
.cb:disabled{opacity:.3}
.cb.prz{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fffdf6;color:#1a1636;font-size:.8rem;letter-spacing:0;text-transform:none;padding:6px}
.cb.prz img{width:100%;height:12vh;object-fit:contain}.cb.prz .em{font-size:2rem}
#cmMic{flex:none;padding:7px 10px calc(env(safe-area-inset-bottom) + 7px);text-align:center;font-size:.8rem;background:#000;color:rgba(255,255,255,.75);min-height:2.2em}
#cmMic.live{background:#e5173f;color:#fff;font-weight:800}
body.incmp #net{display:none}body.incmp #logb{bottom:auto!important;top:2px!important;right:2px!important;z-index:20;padding:3px 8px;font-size:.6rem;opacity:.35}
</style></head><body>
<small>GAME NIGHT</small>
<div id="join" class="col">
  <h1>Join the game</h1>
  <input id="code" class="code" placeholder="TV code" maxlength="4" autocapitalize="characters" autocomplete="off">
  <input id="name" placeholder="Your name" maxlength="16" autocomplete="off">
  <div class="avprev"><img id="avimg" alt="" width="112" height="112"></div>
  <div class="avtabs" id="avtabs"></div>
  <div class="avgrid" id="avgrid"></div>
  <div class="avrow"><button class="mini" id="avshuf">🔀 Shuffle</button><button class="mini" id="avcam">📷 Selfie</button><input type="file" id="avfile" accept="image/*" capture="user" class="hide"></div>
  <button id="go">Join</button>
</div>
<div id="duel" class="hide">
  <div class="pl"><div class="pc" id="pa"><img alt=""><div><b></b><i></i></div></div><div class="pc" id="pb"><img alt=""><div><b></b><i></i></div></div></div>
  <div id="catbar"><span id="cat"></span><span id="hint"></span></div>
  <div id="q" class="q"></div>
  <div id="rv"></div>
  <button id="pass">PASS</button>
  <div id="dst"></div><div id="dheard"></div>
  <div id="map"></div>
</div>
<div id="cmp" class="hide">
  <div id="cmScores"></div>
  <div id="cmHead"><small id="cmE"></small><b id="cmT"></b><p id="cmS"></p></div>
  <div id="cmBody"><div id="cmMain"></div><div id="cmFb"></div>
    <form id="cmForm" class="hide" autocomplete="off"><input id="cmIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"><button type="submit" class="cb">Send</button></form>
    <div id="cmNum" class="hide"><div class="disp" id="cmDisp">$0</div><div class="kp" id="cmKp"></div></div>
  </div>
  <div id="cmBtns"></div>
  <div id="cmMic"></div>
</div>
<div id="play" class="col hide">
  <img id="myav" alt="" class="hide"><div id="big">🎤</div>
  <h1 id="who"></h1>
  <div id="st"></div>
  <div id="heard"></div>
  <button class="mini" id="catBtn" style="display:none;margin-top:14px;font-size:1rem;padding:12px 18px">Choose my categories</button>
  <div id="catNote" style="opacity:.75;font-size:.85rem;margin-top:6px;max-width:300px"></div>
</div>
<div id="catSheet" style="display:none;position:fixed;inset:0;z-index:40;background:#10062b;overflow:auto;padding:14px 14px 90px">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><b id="catHead" style="flex:1;font-size:1.1rem">Pick your categories</b><button class="mini" id="catDone" style="padding:10px 16px">Done</button></div>
  <div id="catHelp" style="opacity:.8;font-size:.85rem;margin-bottom:10px">Your first pick is your category in a normal game. In a 4-player Floor you can pick up to 4 (one per square).</div>
  <div id="catSel" style="font-weight:800;margin-bottom:10px;min-height:1.4em"></div>
  <div id="catList"></div>
</div>
<button class="mini" id="logb" style="position:fixed;bottom:26px;right:10px;opacity:.6">📋 Log</button>
<div id="net" style="position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:.7rem;opacity:.45"></div>
<div id="inapp" class="hide" style="position:fixed;left:0;right:0;bottom:0;z-index:30;background:#e5173f;color:#fff;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);text-align:center;font-weight:700;font-size:.95rem">
  Microphone won't work in this browser. Open this page in Safari.
  <div style="margin-top:8px"><button class="mini" id="cpy" style="background:#fff;color:#e5173f">Copy link</button> <button class="mini" id="inx">Dismiss</button></div></div>
<script>(function(){var u=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(u),inapp=ios&&!/Safari\//.test(u)||/FBAN|FBAV|Instagram|Line\/|MicroMessenger|; wv\)/.test(u);
if(!inapp)return;var b=document.getElementById("inapp");b.classList.remove("hide");
document.getElementById("inx").onclick=function(){b.classList.add("hide")};
document.getElementById("cpy").onclick=function(){var t=location.href,d=document.getElementById("cpy");
(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(function(){var i=document.createElement("input");i.value=t;document.body.appendChild(i);i.select();try{document.execCommand("copy")}catch(e){}i.remove()}).then(function(){d.textContent="Copied. Paste into Safari"})}})();</script>
<script>/* reload if a newer build exists (phone browsers cache this page) */
const JB_BUILD=56;fetch("version.txt?t="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(t=>{if(parseInt(t,10)>JB_BUILD&&!sessionStorage.getItem("gn.rl"+t)){try{sessionStorage.setItem("gn.rl"+t,"1")}catch(e){}location.replace(location.pathname+location.search.replace(/[&?]r=\d+/,"")+(location.search?"&":"?")+"r="+Date.now())}}).catch(()=>{});</script>
