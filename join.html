<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1250"><title>Game Night · Join</title>
<style>
:root{--g:#ffd84a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,#150e45,#3a1d8f);color:#fff;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;}
.col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%}
input{-webkit-user-select:text;user-select:text}
button{-webkit-user-select:none;user-select:none}
h1{margin:0;font-size:1.7rem;letter-spacing:.04em}
small{opacity:.7;letter-spacing:.2em;font-size:.75rem}
input{font:700 1.4rem system-ui;padding:14px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;text-align:center;width:min(320px,90vw);text-transform:none}
input.code{text-transform:uppercase;letter-spacing:.3em}
button{font:800 1.3rem system-ui;padding:16px 34px;border:0;border-radius:999px;background:var(--g);color:#2a1a00}
#st{opacity:.9;min-height:1.5em}
#big{font-size:4.5rem;transition:transform .2s}
.live #big{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
#heard{min-height:3em;font-size:1.5rem;font-weight:700;max-width:92vw}
.hide{display:none!important}
</style></head><body>
<small>GAME NIGHT</small>
<div id="join" class="col">
  <h1>Join the game</h1>
  <input id="code" class="code" placeholder="TV code" maxlength="4" autocapitalize="characters" autocomplete="off">
  <input id="name" placeholder="Your name" maxlength="16" autocomplete="off">
  <button id="go">Join</button>
</div>
<div id="play" class="col hide">
  <div id="big">🎤</div>
  <h1 id="who"></h1>
  <div id="st"></div>
  <div id="heard"></div>
</div>
<script src="peerjs.min.js"></script>
<script src="join.js"></script>
</body></html>
